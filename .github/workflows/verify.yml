name: Verify installed hooks

on:
  push:
  pull_request:

jobs:
  wheel-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build 'setuptools>=77'
      - name: Exercise installed wheel and hook protocol
        run: python -m unittest discover -s tests -v
