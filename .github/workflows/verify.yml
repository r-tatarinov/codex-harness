name: Check code quality

on:
  push:
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Harness and analyzers
        run: python -m pip install .
      - name: Check lint, formatting, and installed package types
        run: |
          python -m ruff check checks hooks src
          python -m ruff format --check checks hooks src
          python -m black --check --target-version py312 checks hooks src
          python -m mypy --check-untyped-defs --follow-untyped-imports -p codex_harness
